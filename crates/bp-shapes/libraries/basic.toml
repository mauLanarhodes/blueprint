# Blueprint basic shapes.
#
# Each [[shape]] needs an id, a name, a default size in page units and an
# outline. An outline is "rect" (rounded by the style's corner radius),
# "stadium", "ellipse", or SVG-like path data (absolute M L H V C Q A Z) in
# box-relative coordinates: 0 is the left/top edge of the shape's box and 1
# the right/bottom edge. A coordinate may add an offset in page units, so
# "1-12" is 12 units in from the right edge however wide the shape is.
#
# Optional keys:
#   keywords   extra search terms for the palette
#   details    lines stroked on top of the fill (same path syntax)
#   back       paths drawn behind the outline with the same fill and stroke
#   text_area  [x0, y0, x1, y1] fractions of the box where text goes
#   ports      [{ id, x, y, dir }] connection points; by default one per
#              side ("n", "e", "s", "w") where the outline meets the lines
#              through the centre
#   style      default style overrides (see bp_model::Style)

id = "basic"
name = "Basic"

[[shape]]
id = "rectangle"
name = "Rectangle"
keywords = ["box", "square", "block"]
size = [140, 70]
outline = "rect"

[[shape]]
id = "rounded-rectangle"
name = "Rounded rectangle"
keywords = ["box", "rounded", "card"]
size = [140, 70]
outline = "rect"
style = { corner_radius = 10 }

