# Blueprint flowchart shapes (ANSI/ISO 5807 symbols). The format is
# described at the top of basic.toml.

id = "flowchart"
name = "Flowchart"

[[shape]]
id = "terminator"
name = "Terminator"
keywords = ["start", "end", "begin", "stop", "pill"]
size = [120, 50]
outline = "stadium"
text_area = [0.1, 0, 0.9, 1]

[[shape]]
id = "process"
name = "Process"
keywords = ["step", "action", "task", "rectangle"]
size = [120, 60]
outline = "rect"

[[shape]]
id = "decision"
name = "Decision"
keywords = ["if", "branch", "condition", "yes no", "diamond"]
size = [120, 80]
outline = "M 0.5 0 L 1 0.5 L 0.5 1 L 0 0.5 Z"
text_area = [0.2, 0.2, 0.8, 0.8]

[[shape]]
id = "data"
name = "Data"
keywords = ["input", "output", "io", "parallelogram"]
size = [120, 60]
outline = "M 0.2 0 L 1 0 L 0.8 1 L 0 1 Z"
text_area = [0.15, 0, 0.85, 1]

[[shape]]
id = "predefined-process"
name = "Predefined process"
keywords = ["subroutine", "function", "call", "procedure"]
size = [120, 60]
outline = "rect"
details = "M 0+12 0 L 0+12 1 M 1-12 0 L 1-12 1"
text_area = [0.12, 0, 0.88, 1]

[[shape]]
id = "document"
name = "Document"
keywords = ["report", "paper", "file", "print"]
size = [120, 70]
outline = "M 0 0 L 1 0 L 1 0.9067 C 0.65 0.64 0.4 1.1733 0 0.9387 Z"
text_area = [0, 0, 1, 0.85]

[[shape]]
id = "multi-document"
name = "Multiple documents"
keywords = ["reports", "papers", "files"]
size = [130, 80]
back = [
  "M 0.12 0 L 1 0 L 1 0.7797 C 0.692 0.5504 0.472 1.0091 0.12 0.8072 Z",
  "M 0.06 0.07 L 0.94 0.07 L 0.94 0.8497 C 0.632 0.6204 0.412 1.0791 0.06 0.8772 Z",
]
outline = "M 0 0.14 L 0.88 0.14 L 0.88 0.9197 C 0.572 0.6904 0.352 1.1491 0 0.9472 Z"
text_area = [0, 0.14, 0.88, 0.9]

[[shape]]
id = "manual-input"
name = "Manual input"
keywords = ["keyboard", "user input", "form", "type"]
size = [120, 60]
outline = "M 0 0.25 L 1 0 L 1 1 L 0 1 Z"
text_area = [0, 0.25, 1, 1]

[[shape]]
id = "manual-operation"
name = "Manual operation"
keywords = ["human", "manual step", "trapezoid"]
size = [120, 60]
outline = "M 0 0 L 1 0 L 0.8 1 L 0.2 1 Z"
text_area = [0.15, 0, 0.85, 1]

[[shape]]
id = "preparation"
name = "Preparation"
keywords = ["setup", "initialise", "initialize", "loop init", "hexagon"]
size = [120, 60]
outline = "M 0.15 0 L 0.85 0 L 1 0.5 L 0.85 1 L 0.15 1 L 0 0.5 Z"
text_area = [0.12, 0, 0.88, 1]

[[shape]]
id = "delay"
name = "Delay"
keywords = ["wait", "pause", "hold"]
size = [100, 60]
outline = "M 0 0 L 0.6 0 A 0.4 0.5 0 0 1 0.6 1 L 0 1 Z"
text_area = [0, 0, 0.85, 1]

[[shape]]
id = "stored-data"
name = "Stored data"
keywords = ["storage", "data store"]
size = [120, 60]
outline = "M 0.15 0 L 1 0 A 0.15 0.5 0 0 0 1 1 L 0.15 1 A 0.15 0.5 0 0 1 0.15 0 Z"
text_area = [0.1, 0, 0.85, 1]

[[shape]]
id = "database"
name = "Database"
keywords = ["db", "cylinder", "disk", "sql", "direct access storage"]
size = [80, 100]
outline = "M 0 0.12 A 0.5 0.12 0 0 1 1 0.12 L 1 0.88 A 0.5 0.12 0 0 1 0 0.88 Z"
details = "M 0 0.12 A 0.5 0.12 0 0 0 1 0.12"
text_area = [0, 0.24, 1, 1]

[[shape]]
id = "internal-storage"
name = "Internal storage"
keywords = ["memory", "ram"]
size = [100, 80]
outline = "rect"
details = "M 0+14 0 L 0+14 1 M 0 0+14 L 1 0+14"
text_area = [0.14, 0.18, 1, 1]

[[shape]]
id = "display"
name = "Display"
keywords = ["screen", "monitor", "output"]
size = [120, 60]
outline = "M 0.15 0 L 0.8 0 A 0.2 0.5 0 0 1 0.8 1 L 0.15 1 L 0 0.5 Z"
text_area = [0.12, 0, 0.88, 1]

[[shape]]
id = "on-page-connector"
name = "On-page connector"
keywords = ["circle", "jump", "reference", "label"]
size = [40, 40]
outline = "ellipse"
text_area = [0.1, 0.1, 0.9, 0.9]

[[shape]]
id = "off-page-connector"
name = "Off-page connector"
keywords = ["page", "jump", "continue", "pentagon"]
size = [50, 50]
outline = "M 0 0 L 1 0 L 1 0.6 L 0.5 1 L 0 0.6 Z"
text_area = [0, 0, 1, 0.65]

[[shape]]
id = "merge"
name = "Merge"
keywords = ["combine", "triangle"]
size = [70, 60]
outline = "M 0 0 L 1 0 L 0.5 1 Z"
text_area = [0.2, 0, 0.8, 0.55]

[[shape]]
id = "extract"
name = "Extract"
keywords = ["split", "triangle"]
size = [70, 60]
outline = "M 0.5 0 L 1 1 L 0 1 Z"
text_area = [0.2, 0.45, 0.8, 1]

[[shape]]
id = "sort"
name = "Sort"
keywords = ["order"]
size = [70, 70]
outline = "M 0.5 0 L 1 0.5 L 0.5 1 L 0 0.5 Z"
details = "M 0 0.5 L 1 0.5"
text_area = [0.25, 0.25, 0.75, 0.75]

[[shape]]
id = "collate"
name = "Collate"
keywords = ["hourglass", "gather"]
size = [60, 70]
outline = "M 0 0 L 1 0 L 0 1 L 1 1 Z"
ports = [
  { id = "n", x = 0.5, y = 0, dir = "n" },
  { id = "s", x = 0.5, y = 1, dir = "s" },
]

[[shape]]
id = "loop-limit"
name = "Loop limit"
keywords = ["loop start", "for", "while", "repeat"]
size = [120, 60]
outline = "M 0.15 0 L 0.85 0 L 1 0.3 L 1 1 L 0 1 L 0 0.3 Z"
text_area = [0, 0.2, 1, 1]

[[shape]]
id = "loop-limit-end"
name = "Loop limit end"
keywords = ["loop end", "until"]
size = [120, 60]
outline = "M 0 0 L 1 0 L 1 0.7 L 0.85 1 L 0.15 1 L 0 0.7 Z"
text_area = [0, 0, 1, 0.8]

[[shape]]
id = "or"
name = "Or"
keywords = ["logic", "junction"]
size = [50, 50]
outline = "ellipse"
details = "M 0.5 0 L 0.5 1 M 0 0.5 L 1 0.5"

[[shape]]
id = "summing-junction"
name = "Summing junction"
keywords = ["and", "logic", "junction"]
size = [50, 50]
outline = "ellipse"
details = "M 0.1464 0.1464 L 0.8536 0.8536 M 0.8536 0.1464 L 0.1464 0.8536"

[[shape]]
id = "annotation"
name = "Annotation"
keywords = ["comment", "note", "bracket"]
size = [120, 60]
outline = "M 0+14 0 L 0 0 L 0 1 L 0+14 1"
text_area = [0.08, 0, 1, 1]
ports = [{ id = "w", x = 0, y = 0.5, dir = "w" }]
style = { fill = "none", text_align = "left" }
